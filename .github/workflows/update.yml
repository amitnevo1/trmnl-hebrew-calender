name: Render Hebrew Calendar for TRMNL

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

            - name: Install system fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-freefont-ttf fonts-dejavu-core
          pip install -r requirements.txt

      - name: Generate calendar image
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: python generate.py

      - name: Commit and push updated image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/calendar.bmp
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update calendar image" && git push)
  